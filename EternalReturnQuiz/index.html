<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이터널 리턴 퀴즈 아레나</title>
    <meta
      name="description"
      content="이터널 리턴 감각을 빠르게 테스트하는 인터랙티브 퀴즈 사이트"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="quiz-panel" aria-labelledby="site-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">Lumia Island Drill</p>
            <h1 id="site-title">이터널 리턴 퀴즈 아레나</h1>
          </div>
          <div class="score-card" aria-live="polite">
            <span>점수</span>
            <strong id="score">0</strong>
          </div>
        </div>

        <div class="status-grid" aria-label="퀴즈 상태">
          <div>
            <span>문항</span>
            <strong id="question-count">1 / 10</strong>
          </div>
          <div>
            <span>콤보</span>
            <strong id="combo">0</strong>
          </div>
          <div>
            <span>남은 시간</span>
            <strong id="timer">20</strong>
          </div>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar"></div>
        </div>

        <div class="category-row" id="category-row" aria-label="카테고리 선택"></div>

        <article class="question-card">
          <p id="question-category" class="question-category">기초</p>
          <h2 id="question-text">문제를 불러오는 중...</h2>
          <div id="answers" class="answers"></div>
        </article>

        <div class="feedback-row">
          <p id="feedback" aria-live="polite"></p>
          <button id="next-button" class="primary-button" type="button">다음 문제</button>
        </div>
      </section>

      <aside class="side-panel" aria-label="결과와 복습">
        <div class="island-card">
          <canvas id="island-radar" width="360" height="280" aria-hidden="true"></canvas>
          <div class="island-copy">
            <p class="eyebrow">오늘의 감각</p>
            <h2 id="rank-title">루미아 입문자</h2>
            <p id="rank-copy">정답을 맞힐수록 분석 데이터가 갱신됩니다.</p>
          </div>
        </div>

        <div class="review-card">
          <div class="section-title">
            <h2>오답 복습</h2>
            <button id="restart-button" type="button">처음부터</button>
          </div>
          <ul id="review-list"></ul>
        </div>
      </aside>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
